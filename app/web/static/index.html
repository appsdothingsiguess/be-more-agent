<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BMO</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<div id="login" class="hidden">
  <h1>BMO</h1>
  <form id="loginForm">
    <input id="pin" type="password" inputmode="numeric" autocomplete="current-password" maxlength="32" placeholder="PIN" aria-label="PIN">
    <button type="submit">Log in</button>
    <p id="loginErr" class="err"></p>
  </form>
</div>

<div id="app" class="hidden">
  <div id="main">
    <header>
      <h1>BMO</h1>
      <span id="liveChip" class="chip">...</span>
      <span id="recon" class="hidden">reconnecting...</span>
      <button class="ghost icon" id="gear" type="button" aria-label="Settings" aria-controls="sheet" aria-expanded="false">&#9881;</button>
    </header>
    <div id="banner" class="hidden" role="alert"><div id="bannerText"></div><button class="ghost" id="bannerX" type="button" aria-label="Dismiss">x</button></div>
    <div id="chat" role="log" aria-live="polite"></div>
    <div id="composer">
      <div id="micHint" class="muted hidden"></div>
      <div class="compose-row">
        <button id="mic" class="mic" type="button" aria-label="Start recording">
          <span id="micIcon">&#127908;</span>
          <span id="levelBars" class="bars hidden" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>
        </button>
        <textarea id="text" rows="1" maxlength="2000" placeholder="Say something to BMO" aria-label="Message"></textarea>
        <button id="send" type="button">Send</button>
        <button id="stop" class="stop hidden" type="button">Stop</button>
      </div>
      <div id="sendErr" class="err"></div>
    </div>
  </div>

  <aside id="sheet" class="hidden" role="dialog" aria-label="Settings" tabindex="-1">
    <div class="sheet-head"><h2>Settings</h2><button class="ghost" id="sheetX" type="button" aria-label="Close settings">Close</button></div>

    <section>
      <h3>Reply audio on this device</h3>
      <div id="outSeg" class="seg" role="radiogroup" aria-label="Reply audio on this device">
        <button type="button" role="radio" data-out="device">This device</button>
        <button type="button" role="radio" data-out="bmo">BMO</button>
        <button type="button" role="radio" data-out="both">Both</button>
        <button type="button" role="radio" data-out="text">Text only</button>
      </div>
      <p class="muted">Where spoken replies to your messages are played.</p>
    </section>

    <section>
      <h3>BMO's speaker</h3>
      <div class="row" id="row-vol"><label for="s-vol">Volume <span id="s-vol-v"></span></label><input id="s-vol" type="range" min="0" max="100" step="10"></div>
      <div class="row" id="row-snd"><label for="s-snd">Sound effects</label><input id="s-snd" type="checkbox"></div>
      <div class="row" id="row-mute"><label for="s-mute">Mute BMO (text only)</label><input id="s-mute" type="checkbox"></div>
    </section>

    <section id="sec-listen">
      <h3>Listening</h3>
      <div class="row" id="row-wake"><label for="s-wake">Wake word <span id="wakeModel" class="muted"></span></label><input id="s-wake" type="checkbox"></div>
      <div class="row" id="row-follow"><label for="s-follow">Listen for a follow-up</label><input id="s-follow" type="checkbox"></div>
      <div class="row" id="row-followsec"><label for="s-followsec">Follow-up wait <span id="s-followsec-v"></span> s</label><input id="s-followsec" type="range" min="2" max="15" step="1"></div>
      <div class="row" id="row-gain"><label for="s-gain">Mic boost <span id="s-gain-v"></span> dB</label><input id="s-gain" type="range" min="0" max="30" step="3"></div>
    </section>

    <section id="sec-cam">
      <h3>Camera</h3>
      <div class="row" id="row-cam"><label for="s-cam">Camera mode</label>
        <select id="s-cam"><option value="always">always</option><option value="manual">manual</option><option value="off">off</option></select></div>
    </section>
    <div id="setErr" class="err"></div>

    <section id="memoryPanel">
      <h3>Memory</h3>
      <div class="row hidden" id="memToggleRow"><label for="s-mem">BMO remembers things</label><input id="s-mem" type="checkbox"></div>
      <p id="convCount" class="muted"></p>
      <ul id="memList" class="memlist"></ul>
      <p id="memEmpty" class="muted"></p>
      <div class="row"><button id="forget" class="ghost" type="button">Forget everything</button></div>
      <div id="memMsg" class="muted" role="status"></div>
      <div id="memErr" class="err"></div>
    </section>

    <section id="serverPanel">
      <h3>Status</h3>
      <dl id="serverInfo"></dl>
    </section>

    <section>
      <div class="row"><button class="ghost" id="logout" type="button">Log out</button></div>
    </section>
  </aside>
</div>

<script src="/static/app.js"></script>
</body>
</html>
