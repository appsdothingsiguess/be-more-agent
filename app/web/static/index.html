<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BMO</title>
<style>
:root{--bg:#e6faf3;--fg:#0b3b36;--card:#fff;--accent:#2bb59b;--accent-fg:#fff;--muted:#4c7a73;--line:#b5e3d6;--me:#cdeee4;--bmo:#fff;--err:#c0392b;--errbg:#fde8e5}
@media (prefers-color-scheme:dark){:root{--bg:#0d1f1d;--fg:#d9f5ee;--card:#152e2b;--accent:#2bb59b;--accent-fg:#06201c;--muted:#8fbdb3;--line:#25504a;--me:#1d4a43;--bmo:#183532;--err:#ff8a7a;--errbg:#3b1d1a}}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);font:16px/1.4 system-ui,sans-serif;overflow-x:hidden}
.hidden{display:none!important}
#app{display:flex;flex-direction:column;height:100%;max-width:720px;margin:0 auto}
header{display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--accent);color:var(--accent-fg)}
header h1{margin:0;font-size:1.2rem;flex:1}
.badge{padding:2px 10px;border-radius:12px;background:rgba(255,255,255,.3);font-size:.85rem}
#recon{font-size:.8rem}
button,select,textarea,input{font:inherit;color:inherit}
button{background:var(--accent);color:var(--accent-fg);border:0;border-radius:8px;padding:8px 14px;cursor:pointer}
button.ghost{background:transparent;color:inherit;border:1px solid currentColor}
#banner{background:var(--errbg);color:var(--err);padding:8px 12px;display:flex;gap:8px;align-items:flex-start}
#banner div{flex:1;word-break:break-word}
#chat{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.msg{max-width:85%;padding:8px 12px;border-radius:14px;white-space:pre-wrap;word-break:break-word;border:1px solid var(--line)}
.msg small{display:block;color:var(--muted);font-size:.75rem}
.msg.user{align-self:flex-end;background:var(--me)}
.msg.bmo{align-self:flex-start;background:var(--bmo)}
details{background:var(--card);border-top:1px solid var(--line);padding:6px 12px}
summary{cursor:pointer;font-weight:600}
.row{display:flex;align-items:center;gap:8px;margin:8px 0;flex-wrap:wrap}
.row label{flex:1;min-width:120px}
.row input[type=range]{flex:2;min-width:100px}
.err{color:var(--err);font-size:.9rem}
#composer{padding:8px 12px;background:var(--card);border-top:1px solid var(--line)}
#composer textarea{width:100%;resize:none;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--bg)}
#login{max-width:320px;margin:20vh auto;padding:16px;text-align:center}
#login input{width:100%;font-size:1.5rem;text-align:center;letter-spacing:.3em;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--card);margin:12px 0}
dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:8px 0}
dd{margin:0;word-break:break-word}
</style>
</head>
<body>
<div id="login" class="hidden">
  <h1>BMO</h1>
  <form id="loginForm">
    <input id="pin" type="password" inputmode="numeric" autocomplete="current-password" maxlength="32" placeholder="PIN" aria-label="PIN">
    <button type="submit">Log in</button>
    <p id="loginErr" class="err"></p>
  </form>
</div>

<div id="app" class="hidden">
  <header>
    <h1>BMO</h1>
    <span id="recon" class="hidden">reconnecting...</span>
    <span id="badge" class="badge">...</span>
    <button class="ghost" id="logout" type="button">Log out</button>
  </header>
  <div id="banner" class="hidden" role="alert"><div id="bannerText"></div><button class="ghost" id="bannerX" type="button" aria-label="Dismiss">x</button></div>
  <div id="chat" aria-live="polite"></div>

  <details id="settingsPanel">
    <summary>Settings</summary>
    <div class="row"><label for="s-vol">Volume <span id="s-vol-v"></span></label><input id="s-vol" type="range" min="0" max="100" step="10"></div>
    <div class="row"><label for="s-mute">Mute BMO (text only)</label><input id="s-mute" type="checkbox"></div>
    <div class="row"><label for="s-cam">Camera mode</label>
      <select id="s-cam"><option value="always">always</option><option value="manual">manual</option><option value="off">off</option></select></div>
    <div class="row"><label for="s-snd">Sound effects</label><input id="s-snd" type="checkbox"></div>
    <div class="row"><label for="s-gain">Mic boost <span id="s-gain-v"></span> dB</label><input id="s-gain" type="range" min="0" max="30" step="3"></div>
    <div id="setErr" class="err"></div>
  </details>

  <details id="serverPanel">
    <summary>Server</summary>
    <dl id="serverInfo"></dl>
  </details>

  <div id="composer">
    <textarea id="text" rows="2" maxlength="2000" placeholder="Say something to BMO" aria-label="Message"></textarea>
    <div class="row">
      <label><input id="speak" type="checkbox"> Speak reply</label>
      <button id="stop" class="ghost hidden" type="button">Interrupt</button>
      <button id="send" type="button">Send</button>
    </div>
    <div id="sendErr" class="err"></div>
  </div>
</div>

<script>
(function(){
"use strict";
var $=function(id){return document.getElementById(id)};
var es=null, backoff=1000, speakTouched=false, settings={}, state="";

function api(method,path,body){
  var o={method:method,credentials:"same-origin",headers:{}};
  if(body!==undefined){o.headers["Content-Type"]="application/json";o.body=JSON.stringify(body)}
  return fetch(path,o).then(function(r){
    return r.json().catch(function(){return {}}).then(function(j){
      if(r.status===401&&path!=="/api/login"){showLogin()}
      return {ok:r.ok,status:r.status,data:j};
    });
  });
}
function showLogin(){
  if(es){es.close();es=null}
  $("app").classList.add("hidden");$("login").classList.remove("hidden");$("pin").focus();
}
function showApp(){
  $("login").classList.add("hidden");$("app").classList.remove("hidden");
}
function volNum(v){var n=parseInt(String(v),10);return isNaN(n)?0:n}
function applySettings(s){
  settings=s;
  $("s-vol").value=volNum(s["speaker.volume"]);$("s-vol-v").textContent=volNum(s["speaker.volume"])+"%";
  $("s-mute").checked=!!s["ui.text_only"];
  $("s-cam").value=s["camera.vision_mode"];
  $("s-snd").checked=!!s["sounds.enabled"];
  $("s-gain").value=s["microphone.gain_db"];$("s-gain-v").textContent=s["microphone.gain_db"];
  if(!speakTouched)$("speak").checked=!s["ui.text_only"];
}
function init(){
  return api("GET","/api/state").then(function(r){
    if(!r.ok)return;
    showApp();applySettings(r.data.settings);setState(r.data.state);connect();
  });
}
function setState(s){
  state=s;$("badge").textContent=s;
  $("stop").classList.toggle("hidden",!(s==="thinking"||s==="speaking"));
}
function addMsg(who,text){
  var d=document.createElement("div");d.className="msg "+(who==="user"?"user":"bmo");
  var l=document.createElement("small");l.textContent=who==="user"?"You":"BMO";
  var t=document.createElement("span");t.textContent=text;
  d.appendChild(l);d.appendChild(t);
  var c=$("chat");var near=c.scrollHeight-c.scrollTop-c.clientHeight<80;
  c.appendChild(d);
  if(near||who==="user")c.scrollTop=c.scrollHeight;
}
function onEvent(ev){
  if(ev.type==="state")setState(ev.state);
  else if(ev.type==="text")addMsg(ev.who,ev.text);
  else if(ev.type==="error"){
    $("bannerText").textContent=(ev.message||"Error")+(ev.hint?" - "+ev.hint:"");
    $("banner").classList.remove("hidden");
  }
}
function connect(){
  if(es)es.close();
  $("chat").textContent="";
  es=new EventSource("/api/events");
  es.onopen=function(){backoff=1000;$("recon").classList.add("hidden")};
  es.onmessage=function(m){try{onEvent(JSON.parse(m.data))}catch(e){}};
  es.onerror=function(){
    $("recon").classList.remove("hidden");
    es.close();es=null;
    setTimeout(function(){
      api("GET","/api/state").then(function(r){if(r.ok)connect()});
    },backoff);
    backoff=Math.min(backoff*2,15000);
  };
}
$("loginForm").addEventListener("submit",function(e){
  e.preventDefault();
  api("POST","/api/login",{pin:$("pin").value}).then(function(r){
    if(r.ok){$("pin").value="";$("loginErr").textContent="";init()}
    else $("loginErr").textContent=r.data.error||"Login failed";
  });
});
$("logout").addEventListener("click",function(){api("POST","/api/logout",{}).then(showLogin)});
$("bannerX").addEventListener("click",function(){$("banner").classList.add("hidden")});
function send(){
  var t=$("text").value.trim();if(!t)return;
  api("POST","/api/message",{text:t,speak:$("speak").checked}).then(function(r){
    if(r.ok){$("text").value="";$("sendErr").textContent=""}
    else $("sendErr").textContent=r.data.error||"Could not send";
  });
}
$("send").addEventListener("click",send);
$("text").addEventListener("keydown",function(e){
  if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send()}
});
$("speak").addEventListener("change",function(){speakTouched=true});
$("stop").addEventListener("click",function(){api("POST","/api/interrupt",{})});

function post(key,val){
  var b={};b[key]=val;
  api("POST","/api/settings",b).then(function(r){
    if(r.ok){$("setErr").textContent="";applySettings(r.data)}
    else{$("setErr").textContent=(r.data.key?r.data.key+": ":"")+(r.data.error||"Rejected");applySettings(settings)}
  });
}
$("s-vol").addEventListener("input",function(){$("s-vol-v").textContent=this.value+"%"});
$("s-vol").addEventListener("change",function(){post("speaker.volume",parseInt(this.value,10))});
$("s-mute").addEventListener("change",function(){post("ui.text_only",this.checked)});
$("s-cam").addEventListener("change",function(){post("camera.vision_mode",this.value)});
$("s-snd").addEventListener("change",function(){post("sounds.enabled",this.checked)});
$("s-gain").addEventListener("input",function(){$("s-gain-v").textContent=this.value});
$("s-gain").addEventListener("change",function(){post("microphone.gain_db",parseFloat(this.value))});

function refreshServer(){
  api("GET","/api/status").then(function(r){
    if(!r.ok)return;
    var dl=$("serverInfo");dl.textContent="";
    Object.keys(r.data).forEach(function(k){
      var v=r.data[k];if(v===null||v===undefined)v="-";
      if(typeof v==="object")v=JSON.stringify(v);
      var dt=document.createElement("dt");dt.textContent=k;
      var dd=document.createElement("dd");dd.textContent=String(v);
      dl.appendChild(dt);dl.appendChild(dd);
    });
  });
}
setInterval(function(){if($("serverPanel").open&&!$("app").classList.contains("hidden"))refreshServer()},10000);
$("serverPanel").addEventListener("toggle",function(){if(this.open)refreshServer()});

init().then(function(){if($("app").classList.contains("hidden"))showLogin()});
})();
</script>
</body>
</html>
